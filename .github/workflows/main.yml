name: Wails build

on:
  push:
    tags:
    # Match any new tag
      - '*-release'
      - '*-dev'
      - '*-pre'

env:
  # Necessary for most environments as build failure can occur due to OOM issues
  NODE_OPTIONS: "--max-old-space-size=4096"
  OFFICIAL_STATEMENT: ${{ vars.OFFICIAL_STATEMENT }}
  # 赞助码解密密钥：只存放在仓库 Secret（或 Variable）里，不落代码仓库。
  # 缺失时构建产物会回退到占位密钥，导致赞助码校验失败（macOS/Linux 走 CI，最容易踩到）。
  BUILD_KEY: ${{ secrets.BUILD_KEY || vars.BUILD_KEY }}

permissions:
  contents: write

jobs:
  build:
    strategy:
    # Failure in one platform build won't impact the others
      fail-fast: false
      matrix:
        # 自用精简：只编译 Windows amd64（用户唯一目标平台），加快编译速度
        build:
          - name: 'go-stock-fenshi-windows-amd64.exe'
            platform:  'windows/amd64'
            os: 'windows-latest'

    runs-on: ${{ matrix.build.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: recursive

      - name: Get commit message
        id: get_commit_message
        # 必须 shell: bash 统一平台行为（Windows 默认 pwsh 对引号/编码处理不同）；
        # 清洗引号/反斜杠：值会被插入 bash 双引号串与 go -ldflags 单引号包裹，
        # 引号字符会导致注入或破坏 ldflags 分词（含空格的中文 commit message 曾致 macOS 编译失败）
        shell: bash
        run: |
          MSG=$(git log -1 --pretty=format:'%s' | tr -d '"' | tr -d "'" | tr -d '\\')
          echo "commit_message=$MSG" >> $GITHUB_OUTPUT

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Go mod tidy (sync go.sum for new deps)
        run: |
          go mod tidy

      - name: Build wails x go-stock
        uses: ArvinLovegood/wails-build-action@v3.9
        id: build
        with:
          build-name: ${{ matrix.build.name }}
          build-platform: ${{ matrix.build.platform }}
          package: true
          go-version: '1.27'
          build-tags: ${{ github.ref_name }}
          build-commit-message: ${{ steps.get_commit_message.outputs.commit_message }}
          build-statement: ${{ env.OFFICIAL_STATEMENT }}
          build-key: ${{ env.BUILD_KEY }}
          node-version: '22.22.2'
          wails-version: 'v2.15.0'
          nsis: 'true'

  # 自用精简：已移除 finalize（Update release channel）job。
  # 它只在非 -release 结尾 tag（dev/pre）时执行，用于给原作者多渠道发布打标记；
